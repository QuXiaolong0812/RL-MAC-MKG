# Paths are relative to this configuration file.
format_version: 1
dataset:
  entities: ../data/processed/entities.jsonl
  sources: ../data/processed/sources.jsonl
  split_manifest: ../data/processed/splits.json
  references: ../data/processed/ppo_references.jsonl
  demonstrations: ../data/processed/controller_demonstrations.jsonl
  partition: ppo
  shared_entity_ids: []
schema:
  path: ../data/processed/schema.json
environment:
  budget: 30.0
  max_depth: 3
  max_tokens: 2048
reward:
  # Explicit starting values for coefficients not reported in the manuscript.
  # Select these on validation episodes and fix them before test evaluation.
  lambda_h: 1.0
  lambda_p: 1.0
  lambda_g: 1.0
  lambda_c: 0.08
  lambda_u: 0.20
  factual_weight: 0.55
  visual_weight: 0.45
  abstention_threshold: 0.65
  costs_file: ../models/calibration/action_costs.json
controller:
  model_path: ../models/backbones/Qwen3-8B
  checkpoint: ../models/controller/ppo
  device: cpu
  dtype: float32
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
  head_size: 256
  temperature: 0.1
  gradient_checkpointing: true
ppo:
  learning_rate: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.20
  batch_size: 128
  minibatch_size: 16
  epochs: 4
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_gradient_norm: 0.5
specialists:
  textual:
    backend: local
    model_path: ../models/backbones/Qwen3-8B
    adapter_path: ../models/adapters/textual
    multimodal: false
    device: cpu
    dtype: float32
    temperature: 0.1
    max_new_tokens: 1024
  visual:
    backend: local
    model_path: ../models/backbones/Qwen3-VL-8B-Instruct
    adapter_path: ../models/adapters/visual
    multimodal: true
    device: cpu
    dtype: float32
    temperature: 0.1
    max_new_tokens: 1024
  verifier:
    backend: local
    model_path: ../models/backbones/Qwen3-VL-8B-Instruct
    adapter_path: ../models/adapters/verifier
    multimodal: true
    device: cpu
    dtype: float32
  clip:
    backend: local
    model_path: ../models/backbones/clip-vit-base-patch32
    device: cpu
  canonicalizer:
    backend: local
    model_path: ../models/backbones/all-MiniLM-L6-v2
    device: cpu
    threshold: 0.95
    ambiguity_margin: 0.05
  calibration_file: ../models/calibration/verifier.json
media:
  minimum_resolution: 128
  allowed_licenses: [CC0, CC-BY-4.0, CC-BY-SA-4.0]
  max_image_pixels: 40000000
  phash_distance: 4
run:
  seed: 42
  episodes: 240
  output: ../outputs/construction
